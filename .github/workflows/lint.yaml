name: Lint

on: [push, pull_request]

jobs:
  lint-ruff:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up uv
        uses: astral-sh/setup-uv@v1
        with:
          version: latest

      - name: Setup environment
        run: |
          uv venv
          uv sync
      
      - name: Lint with ruff
        run: uv run ruff check
